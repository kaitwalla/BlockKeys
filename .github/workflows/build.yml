name: macOS build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer
        run: bash -n install.sh
      - name: Compile app and helper
        run: swiftc -O -framework AppKit -framework IOKit Sources/*.swift -o /tmp/BlockKeys
      - name: Validate app plist
        run: plutil -lint Info.plist
