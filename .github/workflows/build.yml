name: macOS build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer
        run: bash -n install.sh
      - name: Compile app and helper
        run: |
          clang -fobjc-arc -c Sources/HIDMappingBridge.m -o /tmp/HIDMappingBridge.o
          swiftc -O -framework AppKit -framework IOKit Sources/*.swift /tmp/HIDMappingBridge.o -o /tmp/BlockKeys
      - name: Validate app plist
        run: plutil -lint Info.plist
