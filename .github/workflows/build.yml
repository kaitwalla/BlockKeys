name: macOS build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer
        run: |
          bash -n install.sh
          bash -n Tests/LaunchdMappingProbe.sh
      - name: Compile app
        run: |
          swiftc -O -framework AppKit -framework IOKit Sources/*.swift -o /tmp/BlockKeys
      - name: Validate app plist
        run: plutil -lint Info.plist
